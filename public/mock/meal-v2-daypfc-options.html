<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日別画面の品ごとPFC表記 5案比較</title>
<style>
  :root{ --teal:#14b8a6; --teal-d:#0f766e; --teal-bg:#f0fdfa; --ink:#1f2937; --sub:#6b7280; --line:#e5e7eb; --bg:#f6f7f8; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; background:#d1d5db; color:var(--ink); display:flex; flex-direction:column; align-items:center; gap:16px; padding:20px 0 80px; }
  .note{ max-width:390px; width:100%; background:#fffbe6; border:1px solid #f4d67c; border-radius:10px; padding:10px 12px; font-size:12px; line-height:1.6; color:#7a5d00; }
  .case{ width:390px; }
  .case .label{ font-size:13px; font-weight:800; margin-bottom:6px; }
  .case .label small{ font-weight:600; color:#4b5563; font-size:11px; margin-left:6px; }
  .frame{ background:var(--bg); border-radius:18px; padding:12px; box-shadow:0 4px 14px rgba(0,0,0,.12); }
  .slot{ background:#fff; border-radius:16px; padding:14px; }
  .slot .top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:2px; }
  .slot .name{ font-size:14px; font-weight:700; display:flex; align-items:center; gap:7px; }
  .slot .tag{ font-size:9.5px; font-weight:700; color:var(--teal-d); background:var(--teal-bg); padding:2px 8px; border-radius:99px; }
  .slot .sum{ font-size:13.5px; font-weight:800; color:var(--teal-d); text-align:right; }
  .slot .sum small{ display:block; font-size:9.5px; color:var(--sub); font-weight:600; margin-top:1px; }
  .slot ul{ list-style:none; }
  .slot li{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; border-top:1px dashed #eef0f0; font-size:13px; }
  .slot li:first-child{ border-top:none; }
  .slot li .r{ text-align:right; flex:none; }
  .slot li .r b{ font-size:13px; font-weight:700; color:#374151; }
  .slot li .r small{ display:block; font-size:9.5px; color:var(--sub); margin-top:1px; }
  .slot .sub{ font-size:10.5px; color:var(--sub); margin-top:2px; }
  .slot .hint{ font-size:10px; color:var(--sub); margin-top:8px; }
  .mtabs{ display:flex; gap:3px; }
  .mtabs b{ padding:3px 9px; border-radius:99px; background:var(--bg); border:1px solid var(--line); font-size:10px; color:var(--sub); font-weight:700; cursor:pointer; }
  .mtabs b.on{ background:var(--teal-d); border-color:var(--teal-d); color:#fff; }
  .tapline{ cursor:pointer; }
  .exp{ display:none; }
  .exp.show{ display:block; }
</style>
</head>
<body>

<div class="note"><b>1日の画面・品ごとのPFC表記 5案比較</b>。データは今の操作の続き(夕食: ごはん234 / サラダチキン121 / つつつs=数値なしの例にしています)。上のサマリーカードには既に1日のPFCがあるので、ここは<b>品ごと・食事ごと</b>の話です。<b>案3はタブ、案4は品名タップが動きます</b>。組み合わせも可(例: 案5の小計+案1の品行)。番号で選んでください。</div>

<div id="cases"></div>

<script>
const ITEMS = [
  { n:'ごはん 1杯', kcal:234, p:3.8, f:0.5, c:55.7 },
  { n:'サラダチキン(市販・プレーン) 1袋', kcal:121, p:26.0, f:1.5, c:1.0 },
  { n:'つつつs', noVal:true },
];
const S = { kcal:355, p:29.8, f:2.0, c:56.7 };
const r1 = x => Math.round(x*10)/10;
const hint = `<div class="hint">「--」は数値なしの記録(写真・名前でのりが確認します)</div>`;
const slotTop = (sumHtml, extra) => `<div class="top"><div class="name">夕食 <span class="tag">記録済み</span></div>${extra||''}<div class="sum">${sumHtml}</div></div>`;

const cases = [];

// 案1: 右2段(検索リストと同形)
cases.push({ label:'案1(推奨)', small:'右2段型: kcalの下に小さくPFC。検索リストと同じ形で統一感', html:
  `<div class="slot">${slotTop('355 kcal')}<ul>` + ITEMS.map(x=>`<li><span>${x.n}</span>
    <span class="r"><b>${x.noVal?'--':x.kcal}</b><small>${x.noVal?'P-- F-- C--':`P${x.p} F${x.f} C${x.c}`}</small></span></li>`).join('') + `</ul>${hint}</div>` });

// 案2: 左2行型
cases.push({ label:'案2', small:'左2行型: 品名の下にPFC行。文字が並ぶぶん縦に伸びる', html:
  `<div class="slot">${slotTop('355 kcal')}<ul>` + ITEMS.map(x=>`<li><span>${x.n}<span class="sub" style="display:block">${x.noVal?'P -- ・ F -- ・ C --':`P ${x.p} ・ F ${x.f} ・ C ${x.c}`}</span></span>
    <span class="r"><b>${x.noVal?'--':x.kcal}</b></span></li>`).join('') + `</ul>${hint}</div>` });

// 案3: 列切替タブ(動く)
cases.push({ label:'案3', small:'列切替型: 見出しの[kcal P F C]タブで右の数字列が切替(量パネルの内訳と同じ操作・動きます)', html:
  `<div class="slot">${slotTop('355 kcal', `<div class="mtabs" id="t3">${['kcal','P','F','C'].map((t,i)=>`<b class="${i===0?'on':''}" onclick="sw3(this,'${t}')">${t}</b>`).join('')}</div>`)}<ul>` +
  ITEMS.map((x,i)=>`<li><span>${x.n}</span><span class="r"><b class="v3" data-vkcal="${x.noVal?'--':x.kcal}" data-vp="${x.noVal?'--':r1(x.p)+'g'}" data-vf="${x.noVal?'--':r1(x.f)+'g'}" data-vc="${x.noVal?'--':r1(x.c)+'g'}">${x.noVal?'--':x.kcal}</b></span></li>`).join('') + `</ul>${hint}</div>` });

// 案4: タップ展開(動く)
cases.push({ label:'案4', small:'タップ展開型: 普段は今のまま・品名タップでPFCが開く(動きます)', html:
  `<div class="slot">${slotTop('355 kcal')}<ul>` + ITEMS.map((x,i)=>`<li class="tapline" onclick="document.getElementById('e4${i}').classList.toggle('show')"><span>${x.n}<span class="sub exp" id="e4${i}">${x.noVal?'P -- ・ F -- ・ C --':`P ${x.p} ・ F ${x.f} ・ C ${x.c}`}</span></span>
    <span class="r"><b>${x.noVal?'--':x.kcal}</b></span></li>`).join('') + `</ul><div class="hint">品名をタップするとPFCが開きます。${'「--」は数値なしの記録'}</div></div>` });

// 案5: 小計のみ
cases.push({ label:'案5', small:'小計のみ型: 品ごとは今のまま・食事の合計にだけPFC', html:
  `<div class="slot">${slotTop(`355 kcal<small>P${S.p} F${S.f} C${S.c}</small>`)}<ul>` + ITEMS.map(x=>`<li><span>${x.n}</span>
    <span class="r"><b>${x.noVal?'--':x.kcal}</b></span></li>`).join('') + `</ul>${hint}</div>` });

document.getElementById('cases').innerHTML = cases.map(c =>
  `<div class="case"><div class="label">${c.label}<small>${c.small}</small></div><div class="frame">${c.html}</div></div>`
).join('');

function sw3(el, key){
  document.querySelectorAll('#t3 b').forEach(b=>b.classList.remove('on')); el.classList.add('on');
  document.querySelectorAll('.v3').forEach(v => v.textContent = v.dataset['v'+key.toLowerCase()]);
}
</script>
</body>
</html>
